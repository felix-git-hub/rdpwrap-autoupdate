name: 2h

on:
  schedule:
    - cron: '30 */2 * * *'   # 每6小时整点执行一次
  workflow_dispatch:

concurrency:
  group: 2h-run
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  run-xray:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 6小时上限

    steps:
      - name: Generate xray config from secrets
        env:
          XRAY_ADDR: ${{ secrets.XRAY_ADDR }}
          XRAY_PORT: ${{ secrets.XRAY_PORT }}
          XRAY_ID: ${{ secrets.XRAY_ID2 }}
          XRAY_SERVER_NAME: ${{ secrets.XRAY_SERVER_NAME }}
          XRAY_PUBLIC_KEY: ${{ secrets.XRAY_PUBLIC_KEY }}
          XRAY_SHORT_ID: ${{ secrets.XRAY_SHORT_ID }}
        run: |
          set -euo pipefail
          cat >/tmp/xray-config.json <<EOF
          {
            "log": {
              "access": "/dev/null",
              "error": "/dev/null",
              "loglevel": "info"
            },
            "inbounds": [],
            "outbounds": [
              {
                "tag": "reverse-direct",
                "protocol": "freedom",
                "settings": {
                  "ipsBlocked": [],
                  "finalRules": [
                    {
                      "action": "allow",
                      "network": "tcp,udp"
                    }
                  ]
                }
              },
              {
                "protocol": "blackhole",
                "tag": "block",
                "settings": {}
              },
              {
                "tag": "reverse",
                "protocol": "vless",
                "settings": {
                  "address": "${XRAY_ADDR}",
                  "port": ${XRAY_PORT},
                  "id": "${XRAY_ID}",
                  "flow": "xtls-rprx-vision",
                  "reverse": {
                    "tag": "reverse-in"
                  },
                  "encryption": "none"
                },
                "streamSettings": {
                  "network": "tcp",
                  "security": "reality",
                  "realitySettings": {
                    "fingerprint": "chrome",
                    "serverName": "${XRAY_SERVER_NAME}",
                    "publicKey": "${XRAY_PUBLIC_KEY}",
                    "spiderX": "",
                    "shortId": "${XRAY_SHORT_ID}"
                  }
                }
              }
            ],
            "routing": {
              "rules": [
                {
                  "inboundTag": [
                    "reverse-in"
                  ],
                  "outboundTag": "reverse-direct"
                }
              ]
            }
          }
          EOF

          # 检查 JSON 是否有效
          jq . /tmp/xray-config.json >/dev/null

      - name: Download xray
        run: |
          set -euo pipefail
          XRAY_DOWNLOAD_DIR=/tmp/xray
          XRAY_DOWNLOAD_URL=https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          mkdir -p "$XRAY_DOWNLOAD_DIR"
          for attempt in 1 2 3 4; do
            rm -f -- "$XRAY_DOWNLOAD_DIR/xray.zip.part"
            if curl --fail --location --connect-timeout 20 --max-time 90 \
                --output "$XRAY_DOWNLOAD_DIR/xray.zip.part" "$XRAY_DOWNLOAD_URL" && \
                unzip -tq "$XRAY_DOWNLOAD_DIR/xray.zip.part" >/dev/null 2>&1; then
              mv -- "$XRAY_DOWNLOAD_DIR/xray.zip.part" "$XRAY_DOWNLOAD_DIR/xray.zip"
              break
            fi
            rm -f -- "$XRAY_DOWNLOAD_DIR/xray.zip.part"
            if [ "$attempt" -eq 4 ]; then
              echo "Xray download failed after 4 attempts (request or ZIP validation failed)." >&2
              exit 1
            fi
            delay=$((attempt * 10))
            echo "Xray download attempt $attempt failed; retrying in ${delay}s." >&2
            sleep "$delay"
          done
          unzip -q "$XRAY_DOWNLOAD_DIR/xray.zip" -d "$XRAY_DOWNLOAD_DIR"
          chmod +x "$XRAY_DOWNLOAD_DIR/xray"

      - name: Run xray for 6 hours
        run: |
          set -euo pipefail
          # 6小时 = 21600 秒，超时后让 action 结束
          timeout 21600 /tmp/xray/xray run -c /tmp/xray-config.json || \
            if [ $? -eq 124 ]; then echo "xray reached 6h runtime and exited by timeout"; exit 0; else exit 1; fi
